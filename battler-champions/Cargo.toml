[package]
name = "battler-champions"
version = "0.1.0"
edition = "2024"
description = "Pokémon Champions rules for battler: a DataStore overlay and engine rules."
authors = ["Jackson Nestelroad <jackson@nestelroad.com>"]
keywords = ["pokemon", "battle"]
license = "MIT"
repository = "https://github.com/jackson-nestelroad/battler/tree/main/battler-champions"

[dependencies]
ahash = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

battler = { workspace = true, features = ["std"] }
battler-data = { workspace = true, features = ["std"] }

[dev-dependencies]
assert_matches = { workspace = true }
pretty_assertions = { workspace = true }

battler-local-data = { workspace = true }
battler-test-utils = { path = "../battler-test-utils" }
